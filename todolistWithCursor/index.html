<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini To-Do List</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <header>
        <h1>My To-Do List</h1>
        <p class="subtitle">Keep it simple. Get it done.</p>
      </header>

      <form id="todo-form">
        <input
          type="text"
          id="task-input"
          placeholder="Add a new task..."
          aria-label="New task"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>

      <p id="pending-count" class="pending">Pending tasks: 0</p>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all">
          All Tasks
        </button>
        <button type="button" class="filter-btn" data-filter="pending">
          Pending
        </button>
        <button type="button" class="filter-btn" data-filter="completed">
          Completed
        </button>
      </div>

      <ul id="task-list" aria-label="Task list"></ul>
    </main>
  </body>
</html>
